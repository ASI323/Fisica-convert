<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Convert Tesla to Gauss (T to G)</title>
    <link rel="alternate" hreflang="es" href="https://www.fisicaconvert.com/tesla-a-gauss.html" />
    <link rel="alternate" hreflang="en" href="https://www.fisicaconvert.com/tesla-to-gauss.html" />
    <style>body{font-family:sans-serif;padding:20px;max-width:800px;margin:auto}.box{border:2px solid #003366;padding:20px;border-radius:10px;background:#f9f9f9}input{padding:10px;width:120px}</style>
</head>
<body>
    <h1>Convert Tesla to Gauss</h1>
    <div class="box">
        <input type="number" id="inputVal" placeholder="0" oninput="convert()">
        <p>Result in <strong>Gauss</strong>:</p>
        <div id="result" style="font-size: 2em; color: #003366;">0.00</div>
    </div>
    <h3>Formula: G = T × 10,000</h3>
    <script>function convert(){let val=document.getElementById('inputVal').value; let res=val*10000; document.getElementById('result').innerText=res.toLocaleString();}</script>
</body>
</html>
