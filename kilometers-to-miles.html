<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Convert Kilometers to Miles (km to mi)</title>
    <link rel="alternate" hreflang="es" href="https://www.fisicaconvert.com/kilometros-a-millas.html" />
    <link rel="alternate" hreflang="en" href="https://www.fisicaconvert.com/kilometers-to-miles.html" />
    <style>body{font-family:sans-serif;padding:20px;max-width:800px;margin:auto}.box{border:2px solid #003366;padding:20px;border-radius:10px;background:#f9f9f9}input{padding:10px;width:120px}</style>
</head>
<body>
    <h1>Convert Kilometers to Miles</h1>
    <div class="box">
        <input type="number" id="inputVal" placeholder="0" oninput="convert()">
        <p>Result in <strong>Miles</strong>:</p>
        <div id="result" style="font-size: 2em; color: #003366;">0.00</div>
    </div>
    <h3>Formula: mi = km × 0.62137</h3>
    <script>function convert(){let val=document.getElementById('inputVal').value; let res=val*0.621371; document.getElementById('result').innerText=res.toFixed(3);}</script>
</body>
</html>
